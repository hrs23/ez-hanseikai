name: test

on: push

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: node --test scripts/ui-test.mjs

  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          shared-key: release-build
          cache-on-failure: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: ffmpeg
        with:
          path: ffmpeg
          key: ffmpeg-8.1-essentials
      - name: Download ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/GyanD/codexffmpeg/releases/download/8.1/ffmpeg-8.1-essentials_build.zip -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower() -ne '8748283d821613d930b0e7be685aaa9df4ca6f0ad4d0c42fd02622b3623463c6') { throw 'checksum mismatch' }
          Expand-Archive ffmpeg.zip unpacked
          New-Item -ItemType Directory ffmpeg | Out-Null
          Get-ChildItem unpacked -Recurse -Include ffmpeg.exe, ffprobe.exe | Move-Item -Destination ffmpeg
      - run: npm ci
      - run: npx tauri build --no-bundle
      - run: Copy-Item ffmpeg/ffmpeg.exe src-tauri/target/release/ffmpeg.exe
        shell: pwsh
      - name: End-to-end test
        timeout-minutes: 30
        run: node scripts/e2e.mjs src-tauri/target/release/ez-hanseikai.exe ffmpeg
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: e2e
          retention-days: 7
          path: |
            ${{ runner.temp }}/e2e/*.png
            ${{ runner.temp }}/e2e/*.txt
            ${{ runner.temp }}/e2e/*.json
