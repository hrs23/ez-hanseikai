name: test

on: push

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: node --test scripts/ui-test.mjs

  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: ffmpeg
        with:
          path: ffmpeg
          key: ffmpeg-8.1-essentials
      - name: Download ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/GyanD/codexffmpeg/releases/download/8.1/ffmpeg-8.1-essentials_build.zip -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower() -ne '8748283d821613d930b0e7be685aaa9df4ca6f0ad4d0c42fd02622b3623463c6') { throw 'checksum mismatch' }
          Expand-Archive ffmpeg.zip unpacked
          New-Item -ItemType Directory ffmpeg | Out-Null
          Get-ChildItem unpacked -Recurse -Include ffmpeg.exe, ffprobe.exe | Move-Item -Destination ffmpeg
      - run: npm ci
      - run: npx tauri build ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' && '--no-sign' || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: Copy-Item ffmpeg/ffmpeg.exe src-tauri/target/release/ffmpeg.exe
        shell: pwsh
      - name: End-to-end test
        timeout-minutes: 30
        run: node scripts/e2e.mjs src-tauri/target/release/ggi-hanseikai.exe ffmpeg
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/main'
        with:
          name: installer
          retention-days: 1
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: e2e
          retention-days: 7
          path: |
            ${{ runner.temp }}/e2e/*.png
            ${{ runner.temp }}/e2e/*.txt
            ${{ runner.temp }}/e2e/*.json

  release:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: installer
          path: nsis
      - name: Publish the release and the update manifests
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml)"
          notes="The installer is unsigned, so Windows SmartScreen warns: choose More info, then Run anyway. It installs for the current user only. ffmpeg is not included; the app downloads it on first run."
          case "$tag" in *-*) pre=--prerelease ;; *) pre= ;; esac
          exe=$(ls nsis/*-setup.exe)
          name=$(basename "$exe")
          jq -n --arg version "${tag#v}" --arg notes "$notes" --arg pub_date "$(date -u +%FT%TZ)" --arg signature "$(cat "$exe.sig")" --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/${name// /.}" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > latest.json
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" "$exe" "$exe.sig" latest.json --target "$GITHUB_SHA" --title "GGI Hanseikai $tag" --notes "$notes" $pre
          gh release download "$tag" -p latest.json --clobber
          gh release view updater >/dev/null 2>&1 || gh release create updater --prerelease --title "Update manifests" --notes "Rolling manifests read by the in-app updater: latest.json for the stable channel, latest-beta.json for the beta channel."
          cp latest.json latest-beta.json
          gh release upload updater latest-beta.json --clobber
          if [ -z "$pre" ]; then gh release upload updater latest.json --clobber; fi
