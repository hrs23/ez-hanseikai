<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZ Hanseikai</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="logo.svg" alt="">
  <b id="appname"></b><span id="version" class="muted"></span>
  <span id="update" class="small"></span>
  <span id="ffmpeg" class="warn small"></span>
  <span class="spacer"></span>
  <button id="checkupdate">Check for updates</button>
</header>
<div id="app">
  <aside>
    <section>
      <h3>You</h3>
      <div class="row"><input id="name" maxlength="24" placeholder="name"></div>
      <div class="row"><input id="id" class="id" readonly><button id="copy">Copy</button></div>
    </section>
    <section>
      <h3>Peers</h3>
      <div id="peers"></div>
      <div class="row"><input id="peer" class="id" placeholder="paste an ID"><button id="set">Add</button></div>
    </section>
    <section>
      <h3>Record</h3>
      <div class="row"><select id="proc" title="Game sound from"></select></div>
      <div class="row"><button id="rec" class="primary">Record</button><span id="recstate" class="small muted"></span></div>
      <div class="small muted">Records your whole main screen and shares it with everyone you add.</div>
      <div id="notice" class="small warn"></div>
    </section>
    <section>
      <h3>Notes</h3>
      <div class="row"><input id="note" placeholder="note"><button id="addnote">Add</button></div>
      <div id="notes"></div>
    </section>
    <details><summary id="checksummary">Check</summary>
      <div class="row"><button id="runcheck">Run check</button></div>
      <div id="checks" class="small"></div>
    </details>
    <details><summary>Network</summary>
      <div class="row"><button id="report">Save report</button><label class="small"><input type="checkbox" id="addr"> include addresses and name</label></div>
      <div id="reportpath" class="small muted"></div>
      <pre id="debug"></pre>
    </details>
    <details><summary>Files</summary>
      <div id="datainfo" class="small muted"></div>
      <div class="row"><button id="openfolder">Open data folder</button><button id="resetopen">Reset...</button></div>
      <div id="resetpanel" class="panel small" hidden>
        <label><input type="radio" name="level" value="settings" checked> Reset settings and cache: deletes the downloaded video tool, logs, reports, the peer list and your name. Keeps recordings and your ID.</label><br>
        <label><input type="radio" name="level" value="all"> Reset everything: also deletes all recordings and your identity key. Your ID will change. This cannot be undone.</label>
        <div class="row" style="margin-top:8px"><input id="confirm" placeholder="type RESET" hidden></div>
        <div class="row"><button id="openfolder2">Open data folder first</button><button id="doreset" class="danger">Reset</button><button id="resetcancel">Cancel</button></div>
        <div id="reseterr" class="fail"></div>
      </div>
    </details>
  </aside>
  <main>
    <div id="videos" class="videos"></div>
    <div id="empty" class="empty">Add a peer and record. Everyone's recordings appear here.</div>
    <div class="bar">
      <button id="play">Play</button><button id="pause">Pause</button>
      <input id="seek" type="range" min="0" max="0" step="0.1" value="0">
      <span id="time" class="small muted"></span>
    </div>
  </main>
</div>
<div id="recovery" hidden>
  <div class="box">
    <p id="recoverymsg"></p>
    <div class="row">
      <button id="rfolder">Open data folder</button>
      <button id="rreport">Save report</button>
      <button id="rreset" class="danger">Reset settings and cache</button>
      <button id="rcontinue" class="primary">Continue</button>
    </div>
    <div id="rinfo" class="small muted"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
