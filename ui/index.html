<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EZ Hanseikai</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 12px; }
  input, button, select { background: #222; color: #eee; border: 1px solid #444; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .videos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  video { width: 100%; background: #000; }
  .id { width: 24em; font-family: monospace; }
  #status { color: #8c8; }
  .ok { color: #8c8; } .warn { color: #ec8; } .fail { color: #e88; } .info { color: #999; }
  #notes { color: #aaa; font-size: 13px; }
  #debug { color: #8c8; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<div class="row"><b>EZ Hanseikai</b> <span id="version"></span></div>
<div class="row">
  <span>Your ID</span><input class="id" id="id" readonly><button id="copy">Copy</button>
</div>
<div class="row">
  <span>Peer ID</span><input class="id" id="peer" placeholder="paste the other person's ID"><button id="set">Connect</button>
  <span id="status"></span><span id="peermsg" style="color:#e99"></span>
</div>
<div class="row">
  <span>Game sound from</span><select id="proc"></select>
  <button id="rec">Record</button><span id="recstate"></span>
</div>
<div class="row">
  <button id="play">Play</button><button id="pause">Pause</button>
  <input id="seek" type="range" min="0" max="0" step="0.1" value="0" style="width:40%">
  <span id="time"></span>
  <button id="live">Peer live</button>
</div>
<div class="videos"><div><div>You</div><video id="a" muted></video></div><div><div>Peer</div><video id="b"></video></div></div>
<div class="row"><input id="note" placeholder="note" size="40"><button id="addnote">Add note</button></div>
<div id="notes"></div>
<details open><summary>Check</summary>
  <div class="row"><button id="runcheck">Run check</button></div>
  <div id="checks"></div>
</details>
<details><summary>Network</summary>
  <div class="row"><button id="report">Save report</button><label><input type="checkbox" id="addr"> include addresses</label><span id="reportpath"></span></div>
  <pre id="debug"></pre>
</details>
<script>
const { invoke, convertFileSrc } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);
const a = $("a"), b = $("b");
let st = null;
let live = false;
const sec = (us) => us / 1e6;

function delta() {
  if (!st || !st.mine || !st.peer_rec) return 0;
  return sec(st.mine.start_us + (st.offset_us || 0) - st.peer_rec.start_us);
}
function reload(v, rec, resume) {
  const t = v.currentTime;
  v.dataset.size = rec.size;
  v.dataset.retry = Date.now();
  v.load();
  v.onloadedmetadata = () => {
    if (resume === "live") { v.currentTime = Math.max(0, v.duration - 1.5); v.play(); }
    else v.currentTime = t;
  };
}
function source(v, rec) {
  if (!rec || !rec.size) return;
  const src = convertFileSrc(rec.path);
  if (v.dataset.src !== src) { v.dataset.src = src; v.src = src; v.dataset.size = rec.size; return; }
  const loaded = Number(v.dataset.size);
  const settled = v.dataset.seen === String(rec.size);
  v.dataset.seen = rec.size;
  const stuck = v.error && Date.now() - Number(v.dataset.retry || 0) > 3000;
  const grown = rec.size > loaded + 300000 && (v.paused || (v === b && live));
  const final = settled && rec.size !== loaded && v.paused;
  if (stuck || grown || final) reload(v, rec, v === b && live ? "live" : "");
}
function seekTo(pos) {
  a.currentTime = Math.max(0, pos);
  b.currentTime = Math.max(0, pos + delta());
}
function wallOf(pos) { return Math.round(st.mine.start_us + pos * 1e6); }
function posOf(wall) { return sec(wall - (st.offset_us || 0) - st.mine.start_us); }
function apply(cmd, pos) {
  live = false;
  if (cmd === "play") { seekTo(pos); a.play(); b.play(); }
  else if (cmd === "pause") { a.pause(); b.pause(); seekTo(pos); }
  else if (cmd === "seek") seekTo(pos);
}
function send(cmd, pos) {
  apply(cmd, pos);
  if (st && st.mine) invoke("control", { cmd, wallUs: wallOf(pos) }).catch(() => {});
}
window.__TAURI__.event.listen("control", (e) => {
  if (st && st.mine) apply(e.payload.cmd, posOf(e.payload.wall_us));
});
$("play").onclick = () => send("play", a.currentTime);
$("pause").onclick = () => send("pause", a.currentTime);
$("seek").onchange = (e) => send("seek", parseFloat(e.target.value));
$("live").onclick = () => { live = true; if (b.duration) { b.currentTime = Math.max(0, b.duration - 1.5); b.play(); } };
$("copy").onclick = () => navigator.clipboard.writeText($("id").value);
$("set").onclick = () => invoke("set_peer", { id: $("peer").value }).catch((e) => alert(e));
$("rec").onclick = () => st && st.recording
  ? invoke("stop_recording")
  : invoke("start_recording", { audioProcess: $("proc").value }).catch((e) => alert(e));
$("addnote").onclick = () => { invoke("add_note", { text: $("note").value }); $("note").value = ""; };
$("report").onclick = () => invoke("save_report", { includeAddresses: $("addr").checked, audioProcess: $("proc").value }).then((p) => { $("reportpath").textContent = p; }).catch((e) => alert(e));
a.ontimeupdate = () => {
  $("seek").value = a.currentTime;
  $("time").textContent = a.currentTime.toFixed(1) + " s";
  if (!a.paused && Math.abs(b.currentTime - (a.currentTime + delta())) > 0.4) b.currentTime = Math.max(0, a.currentTime + delta());
};
async function refresh() {
  st = await invoke("state");
  $("id").value = st.id;
  $("version").textContent = "v" + st.version;
  $("peermsg").textContent = st.peer_message ? "  " + st.peer_message : "";
  if (document.activeElement !== $("peer")) $("peer").value = st.peer || "";
  $("status").textContent = st.peer ? (st.connected ? "connected" : "connecting...") + (st.offset_us != null ? `, clock offset ${(st.offset_us / 1000).toFixed(1)} ms` : "") : "";
  $("rec").textContent = st.recording ? "Stop" : "Record";
  $("recstate").textContent = (st.mine ? `you ${(st.mine.size / 1e6).toFixed(1)} MB` : "") + (st.peer_rec ? `  peer ${(st.peer_rec.size / 1e6).toFixed(1)} MB` : "");
  source(a, st.mine); source(b, st.peer_rec);
  if (a.duration) $("seek").max = a.duration;
  $("notes").innerHTML = st.notes.map((n) => `<div>${n.who}: ${n.text.replace(/</g, "&lt;")}</div>`).join("");
}
async function refreshDebug() {
  if ($("debug").parentElement.open) $("debug").textContent = await invoke("debug_text");
}
async function runCheck() {
  $("checks").textContent = "checking...";
  const lines = await invoke("check", { audioProcess: $("proc").value });
  $("checks").innerHTML = lines.map((l) => `<div class="${l.level}">${{ ok: "OK", warn: "WARN", fail: "FAIL", info: "" }[l.level]} ${l.text.replace(/</g, "&lt;")}</div>`).join("");
}
$("runcheck").onclick = () => runCheck().catch((e) => alert(e));
async function fillProcesses() {
  const names = await invoke("list_processes");
  const current = $("proc").value;
  $("proc").innerHTML = '<option value="">(no game sound)</option>' + names.map((n) => `<option>${n}</option>`).join("");
  $("proc").value = current || names.find((n) => /apex/i.test(n)) || "";
}
setInterval(() => refreshDebug().catch(() => {}), 2000);
setInterval(() => refresh().catch(() => {}), 1000);
refresh();
fillProcesses().then(runCheck);
$("proc").onfocus = fillProcesses;
</script>
</body>
</html>
